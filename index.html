<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>فیش حقوقی</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1f2937;--muted:#6b7280;--accent:#1e5aa8;--err:#b42318;--line:#d1d5db}
  @media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#9ca3af;--accent:#6aa3f0;--err:#f97066;--line:#374151}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn","Segoe UI",Arial,sans-serif;line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:1.1rem;margin:8px 0 14px;text-align:center}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .bar label{white-space:nowrap}
  .bar select{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
  .card{background:var(--card);border-radius:12px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .card img{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
  .btns{display:flex;gap:10px;margin-top:14px}
  .btns button,.btns a{flex:1;text-align:center;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;text-decoration:none;cursor:pointer}
  .msg{text-align:center;padding:40px 12px;color:var(--muted)}
  .err{color:var(--err)}
  .hide{display:none}
  @media print{body{background:#fff}h1,.bar,.btns{display:none}.card{box-shadow:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>فیش حقوقی</h1>
  <div id="bar" class="bar hide"><label for="month">ماه:</label><select id="month"></select></div>
  <div id="msg" class="msg">در حال بارگذاری…</div>
  <div id="view" class="hide">
    <div class="card"><img id="slip" alt="فیش حقوقی"></div>
    <div class="btns">
      <a id="dl" download="payslip.jpg">دانلود تصویر</a>
      <button onclick="window.print()">چاپ</button>
    </div>
  </div>
</div>
<script>
(function(){
  var k=new URLSearchParams(location.search).get('k')||'';
  var msg=document.getElementById('msg'), view=document.getElementById('view'),
      bar=document.getElementById('bar'), sel=document.getElementById('month'),
      img=document.getElementById('slip'), dl=document.getElementById('dl');
  var enc=new TextEncoder();
  function showErr(t){ view.className='hide'; msg.className='msg err'; msg.textContent=t; }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2);}).join(''); }
  if(!/^[A-Za-z0-9_-]{10,64}$/.test(k)){
    showErr('لینک نامعتبر است. لطفاً از لینکی که برایتان ارسال شده وارد شوید.');
    return;
  }
  if(!(window.crypto&&crypto.subtle)){ showErr('مرورگر شما از این صفحه پشتیبانی نمی‌کند. لطفاً مرورگر را به‌روز کنید.'); return; }
  var lastUrl=null;
  async function load(id){
    msg.className='msg'; msg.textContent='در حال بارگذاری…'; view.className='hide';
    try{
      var name=hex(await crypto.subtle.digest('SHA-256',enc.encode('f:'+id+':'+k)));
      var r=await fetch('data/'+id+'/'+name+'.bin',{cache:'no-cache'});
      if(!r.ok){ showErr('برای این ماه فیشی پیدا نشد. ماه دیگری را انتخاب کنید یا با مسئول مربوطه تماس بگیرید.'); return; }
      var buf=new Uint8Array(await r.arrayBuffer());
      var raw=await crypto.subtle.digest('SHA-256',enc.encode('k:'+k));
      var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
      if(lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl=URL.createObjectURL(new Blob([plain],{type:'image/jpeg'}));
      img.onload=function(){ msg.className='hide'; view.className=''; };
      img.src=lastUrl; dl.href=lastUrl; dl.download='payslip-'+id+'.jpg';
    }catch(e){ showErr('خطا در نمایش فیش. لینک را دوباره بررسی کنید.'); }
  }
  fetch('months.json',{cache:'no-cache'}).then(function(r){return r.json();}).then(function(list){
    if(!list.length){ showErr('هنوز فیشی منتشر نشده است.'); return; }
    list.forEach(function(m){ var o=document.createElement('option'); o.value=m.id; o.textContent=m.label; sel.appendChild(o); });
    if(list.length>1){ bar.className='bar'; }
    sel.onchange=function(){ load(sel.value); };
    load(list[0].id);
  }).catch(function(){ showErr('خطا در بارگذاری. لطفاً دوباره تلاش کنید.'); });
})();
</script>
</body>
</html>
